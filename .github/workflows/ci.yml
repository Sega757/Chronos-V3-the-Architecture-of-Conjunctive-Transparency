name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Generate proto stubs & run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/system1_hypothesis_generator/requirements.txt
            services/system2_chronos_verifier/requirements.txt
            services/arbiter_module/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest is a test-time-only dependency (kept out of each
          # service's production requirements.txt), so it is installed
          # separately here.
          pip install pytest \
            -r services/system1_hypothesis_generator/requirements.txt \
            -r services/system2_chronos_verifier/requirements.txt \
            -r services/arbiter_module/requirements.txt

      - name: Generate gRPC stubs (make proto)
        run: make proto

      - name: Run unit tests (make test)
        run: make test
